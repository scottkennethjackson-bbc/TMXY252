                <main class="d-flex flex-column flex-fill gap-3 p-3 bg-white">
                    <div class="border-bottom">
                        <h2>Create and publish an announcement</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="#">Home</a></li>
                                <li class="breadcrumb-item"><a href="#">Announcements</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Create and publish</li>
                            </ol>
                        </nav>
                    </div>
                    <form class="d-flex flex-column gap-3"
                        action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php"
                        method="post"
                    >
                        <input type="hidden" name="item_ID" value="30001000-5000-654321fedcba">

                        <div class="d-flex flex-column">
                            <label class="form-label fw-bold" for="announcement-title">Announcement Title</label>
                            <input
                                class="form-control"
                                type="text"
                                name="announcement_title"
                                id="announcement-title"
                                value="Planned maintenance - 15th September">
                        </div>

                        <div class="d-flex flex-column">
                            <label class="form-label fw-bold" for="announcement-content">Announcement Content</label>
                            <textarea
                                class="form-control"
                                name="announcement_content"
                                id="announcement-content"
                                rows="5"
                            >We will be performing planned maintenance on our systems on the 15th of September. During this time, some services may be unavailable.</textarea>
                        </div>

                        <div class="d-flex flex-column align-items-start">
                            <label class="form-label fw-bold" for="schedule-announcement">Schedule Announcement</label>
                            <input
                                class="form-control w-auto"
                                type="datetime-local"
                                name="schedule_announcement"
                                id="schedule-announcement"
                                value="2026-09-13T00:00"
                            >
                        </div>

                        <div>
                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="publish_now"
                                id="publish-now"
                                value="true"
                            >
                            <label class="form-label" for="publish-now">Publish Now</label>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <button class="btn btn-secondary" type="reset">Clear Form</button>
                            <button class="btn btn-primary" type="submit">Submit</button>
                        </div>
                    </form>
